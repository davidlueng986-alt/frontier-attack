name: Exact closed-attempt certificates
on:
  push:
    branches: [master]
    paths:
      - 'attempts/jc_affine_projection.py'
      - 'attempts/verify_jc_affine_projection.py'
      - 'runs/jc_affine_projection_certificate.json'
      - 'problems/jacobian/jac.py'
      - '.github/workflows/closed-attempts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - name: Independently verify exact all-parameter certificates and controls
        run: python attempts/verify_jc_affine_projection.py
